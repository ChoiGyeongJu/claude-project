# Deploys main to the OCI VM. Never runs on pull_request, and push events
# from a fork cannot reach this repo's main branch, so this only ever runs
# for pushes accepted onto choigyeongju/market-radar's main.
name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/choigyeongju/market-radar

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Duplicates CI's gate on purpose: this job's pass/fail is what actually
  # blocks the jobs below via `needs:`. Depending on the separate CI
  # workflow's result instead would mean trusting a second, decoupled
  # workflow run — this keeps the gate and the block in the same place.
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # No registry secret to manage: GITHUB_TOKEN is minted per run and
      # scoped to this repo by the `packages: write` permission above.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with both `latest` (what deploy.sh pulls) and the commit
      # SHA (what a manual rollback pins to) — see docs/deploy-oci.md.
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # DEPLOY_SSH_KEY is scoped to run only /usr/local/bin/deploy.sh (see
      # the authorized_keys `command=` restriction in docs/deploy-oci.md),
      # so it cannot be used for anything but this one script even if it
      # leaked. The script always deploys the `latest` tag just pushed
      # above; rolling back to a specific SHA is a separate, manual step
      # documented in docs/deploy-oci.md.
      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy.sh on the VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/usr/local/bin/deploy.sh"
